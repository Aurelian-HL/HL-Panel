server {
    listen 80;
    listen [::]:80;
    server_name xzf.hongle.cc;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xzf.hongle.cc;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/xzf.hongle.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xzf.hongle.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nyvp_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/nyvp/current/web-admin;
    index index.html;
    client_max_body_size 2m;

    include /etc/nginx/snippets/nyvp-security-headers.conf;

    location = /api/v1/auth/login {
        limit_req zone=nyvp_login_per_ip burst=4 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @nyvp_login_rate_limited;
        include /etc/nginx/snippets/nyvp-api-proxy.conf;
    }

    location = /api/v1/customer/auth/login {
        limit_req zone=nyvp_login_per_ip burst=4 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @nyvp_login_rate_limited;
        include /etc/nginx/snippets/nyvp-api-proxy.conf;
    }

    location @nyvp_login_rate_limited {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/nyvp-security-headers.conf;
        return 429 '{"error":{"code":"rate_limited","message":"Too many login attempts; retry later"}}';
    }

    location = /healthz {
        include /etc/nginx/snippets/nyvp-api-proxy.conf;
        access_log off;
    }

    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/nyvp-security-headers.conf;
        return 404 '{"error":{"code":"not_found","message":"resource not found"}}';
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/nyvp-api-proxy.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
