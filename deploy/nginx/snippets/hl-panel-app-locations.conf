root /opt/hl-panel/current/web-admin;
index index.html;
client_max_body_size 2m;

include /etc/nginx/snippets/hl-panel-security-headers.conf;

location = /api/v1/auth/login {
    limit_req zone=hl_panel_login_per_ip burst=4 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/hl-panel-api-proxy.conf;
}

location = /api/v1/customer/auth/login {
    limit_req zone=hl_panel_login_per_ip burst=4 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/hl-panel-api-proxy.conf;
}

location = /healthz {
    include /etc/nginx/snippets/hl-panel-api-proxy.conf;
    access_log off;
}

location = /api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/hl-panel-security-headers.conf;
    return 404 '{"error":{"code":"not_found","message":"resource not found"}}';
}

location ^~ /api/ {
    include /etc/nginx/snippets/hl-panel-api-proxy.conf;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
}

location = /index.html {
    try_files /index.html =404;
    expires -1;
}

location ~ /\. {
    return 404;
}

location / {
    try_files $uri $uri/ /index.html;
}
