name: Node transport safety

on:
  push:
    branches: [main, 'research/reliable-udp-pipe-20261017', 'fix/node-bbr-policy-20261018', 'fix/native-udp-bbr-final-20261018']
    paths:
      - 'deploy/configure-node-bbr.py'
      - 'deploy/configure-node-bbr2.py'
      - 'deploy/install-node.sh'
      - 'deploy/update-node.py'
      - 'internal/agent/config/**'
      - 'internal/agent/engine/**'
      - 'internal/agent/runtime/**'
      - 'internal/control/forwarding/gostconfig/**'
      - 'internal/control/memoryrepo/**'
      - 'internal/control/deploymentreceipts/**'
      - 'internal/control/httpapi/native_udp_integration_test.go'
      - 'tests/integration/gost/forwarding_test.go'
      - 'tests/install/test_node_update.py'
      - 'tests/install/test_node_bbr2_policy.py'
      - 'tests/install/test_node_bbr.py'
      - 'tests/install/node_bbr_linux.py'
      - 'tests/install/node_install.py'
      - 'tests/integration/gost/reliable_udp_test.py'
      - 'deploy/fetch-node-engines.py'
      - 'deploy/reliable_udp_engine.py'
      - 'deploy/reliable-udp-engine/**'
      - 'tests/install/reliable_udp_release.py'
      - 'tests/install/test_reliable_udp_engine.py'
      - 'tests/integration/gost/udp_close_checks.py'
      - 'tests/integration/gost/reliable_udp_pair.py'
      - 'deploy/build-release.ps1'
      - 'deploy/verify-release.ps1'
      - '.github/workflows/node-bbr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bbr:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Verify policy and installer syntax without changing network settings
        run: |
          python3 tests/install/test_node_bbr.py
          python3 tests/install/test_node_bbr2_policy.py
          python3 tests/install/test_node_update.py
          python3 -m py_compile deploy/configure-node-bbr.py
          python3 -m py_compile deploy/configure-node-bbr2.py tests/install/node_bbr_linux.py
          bash -n deploy/install-node.sh
      - name: Verify BBR2 or BBR fallback, persistence, live TCP and rollback on this disposable VM
        shell: bash
        run: |
          set -euo pipefail
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 tests/install/node_bbr_linux.py 2>&1 | tee node-bbr2-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-bbr2-${{ matrix.os }}
          path: node-bbr2-result.log
  token-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - name: Build real web assets for the isolated candidate
        working-directory: apps/web-admin
        run: |
          npm ci
          npm run build
      - name: Build and verify the complete candidate without publishing a tag or release
        shell: pwsh
        run: |
          ./deploy/build-release.ps1 -ReleaseDirectory "$env:RUNNER_TEMP/node-candidate" -Version v0.0.0 -PythonExecutable python3
      - name: Package the verified local candidate for the installer fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          tar -C "$RUNNER_TEMP/node-candidate" -czf "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz" .
          cd "$RUNNER_TEMP/candidate"
          sha256sum hl-panel-linux-amd64.tar.gz > hl-panel-linux-amd64.tar.gz.sha256
      - name: Prepare bounded package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Verify token installation, reinstall and real client forwarding on the disposable VM
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 tests/install/node_install.py --archive-directory "$RUNNER_TEMP/candidate" --version v0.0.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-token-install
          path: |
            node-install.log
            node-install-result.json
  reliable-udp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the locked release recipe
        run: python3 tests/install/test_reliable_udp_engine.py
      - name: Build the same pinned reliable UDP engine as the release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/reliable_udp_engine.py "$RUNNER_TEMP/udp-release" | tee reliable-udp-build.json
      - name: Verify native UDP DIRECT and TCP forwarding through the same release engine
        env:
          NYVP_GOST_BINARY: ${{ runner.temp }}/udp-release/bundle/gost
        run: |
          go test -count=1 -v -run TestStructuredRuleThroughRealGOST ./tests/integration/gost
          go test -count=1 -v -run TestNativeUDPAPIThroughRealEngine ./internal/control/httpapi
      - name: Verify the release engine with packet loss and stream close checks
        shell: bash
        env:
          HL_PANEL_ISOLATED_RELIABLE_UDP_TEST: 'true'
        run: |
          set -euo pipefail
          manifest_sha=$(sha256sum "$RUNNER_TEMP/udp-release/bundle/manifest.json" | cut -d' ' -f1)
          python3 tests/install/reliable_udp_release.py --bundle "$RUNNER_TEMP/udp-release/bundle" --manifest-sha256 "$manifest_sha" --results "$RUNNER_TEMP/udp-release/results.json" 2>&1 | tee reliable-udp-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-reliable-udp
          path: |
            reliable-udp-build.json
            reliable-udp-result.log
            ${{ runner.temp }}/udp-release/results.json
            ${{ runner.temp }}/udp-release/commands.json
            ${{ runner.temp }}/udp-release/command-*.log
            ${{ runner.temp }}/udp-release/bundle/**
