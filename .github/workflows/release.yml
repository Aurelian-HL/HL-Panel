name: HL-panel release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, or candidate version when verification_only is true
        required: true
        default: v0.1.1
        type: string
      verification_only:
        description: Verify the selected workflow ref without creating a tag or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nyvp_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyvp_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      commit: ${{ steps.release_ref.outputs.commit }}
    steps:
      - name: Resolve release tag or isolated verification commit
        id: release_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          VERIFICATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_only == true }}
          VERIFICATION_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'Release tag must start with v and a digit and contain only letters, digits, dots, underscores, or hyphens.' >&2
            exit 1
          fi
          if [[ "$VERIFICATION_ONLY" == true ]]; then
            # Manual acceptance pins this run's selected source commit. No tag
            # is created, and the publish job is disabled for this entire run.
            commit="$VERIFICATION_COMMIT"
          else
            remote_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.ref')
            if [[ "$remote_ref" != "refs/tags/$tag" ]]; then
              echo 'The requested release tag does not exist in this repository.' >&2
              exit 1
            fi
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The release tag did not resolve to a commit.' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - name: Verify Go
        env:
          NYVP_TEST_POSTGRES_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/nyvp_release_test?sslmode=disable
          NYVP_TEST_POSTGRES_ALLOW_MUTATION: 'true'
          HL_LICENSE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test ./...
          go test -race ./internal/control/deploymentreceipts ./internal/panellicense
          go test -race -v ./internal/panellicenseissuer
          go test -race ./internal/control/panelmigration ./internal/control/generations ./internal/control/gatewaymembership ./internal/control/httpapi ./internal/control/usage/httpapi ./internal/control/memoryrepo ./internal/control/postgressnapshot ./internal/agent/controlclient ./internal/agent/runtime ./internal/agent/engine ./internal/agent/usage ./internal/agent/probeecho ./internal/gateway/... ./internal/routing/endpointrouter
          go vet ./...
          for script in deploy/activate-panel-license.sh deploy/setup-panel-license.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/check-panel-license.py deploy/build-license-trust.py tests/install/license_fixture.py
          python3 -m unittest discover -s tests/install -p 'test_panel_license*.py' -v
          for script in install.sh install-node.sh update.sh update-node.sh deploy/install.sh deploy/install-node.sh deploy/update.sh deploy/enable-domain-tls.sh deploy/configure-reality.sh; do bash -n "$script"; done
          for script in deploy/edge-agent/install.sh deploy/edge-agent/enroll.sh; do sh -n "$script"; done
          python3 -m py_compile deploy/update.py deploy/update-node.py deploy/configure-reality.py tests/install/preserve_update.py
          python3 tests/install/test_panel_service_launch.py
          python3 -m py_compile tests/install/fresh_install.py tests/install/web_update.py tests/install/web_release_fixture.py tests/install/issuer_nginx_fixture.py
          python3 -m py_compile tests/install/prepare_ci_apt.py
          python3 -m py_compile tests/install/node_install.py deploy/fetch-node-engines.py deploy/reinstall-node.py
          python3 tests/install/test_node_update.py
          python3 -m py_compile deploy/node-update-worker.py deploy/install-node-update.py
          sudo python3 tests/install/test_node_update_worker.py
          python3 -m py_compile deploy/configure-node-bbr2.py
          python3 -m py_compile deploy/configure-node-bbr.py
          python3 tests/install/test_node_bbr.py
          python3 tests/install/test_node_bbr2_policy.py
          sudo python3 tests/install/test_recovery.py
          python3 tests/install/test_install_addresses.py
          python3 tests/install/test_subscription_nginx.py
          python3 tests/install/test_api_proxy_nginx.py
          python3 -m py_compile deploy/node-control-url.py
          sudo python3 tests/install/test_node_control_url.py
          python3 -m py_compile tests/install/panel_migration.py
          python3 -m py_compile deploy/panel-update-worker.py
          python3 tests/install/test_panel_update_worker.py
          python3 -m py_compile internal/control/panelmigration/remote.py tests/install/automatic_migration.py
          python3 tests/install/test_automatic_migration.py
      - name: Build web admin
        working-directory: apps/web-admin
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build and accept the pinned reliable UDP engine
        env:
          HL_PANEL_ISOLATED_RELIABLE_UDP_TEST: 'true'
        run: |
          set -euo pipefail
          python3 tests/install/test_reliable_udp_engine.py
          python3 -m unittest discover -s tests/integration/gost -p 'test_udp_*_gates.py' -v
          python3 deploy/reliable_udp_engine.py "$RUNNER_TEMP/udp-release" | tee udp-build.json
          manifest_sha=$(sha256sum "$RUNNER_TEMP/udp-release/bundle/manifest.json" | cut -d' ' -f1)
          python3 tests/install/reliable_udp_release.py --bundle "$RUNNER_TEMP/udp-release/bundle" --manifest-sha256 "$manifest_sha" --results "$RUNNER_TEMP/udp-release/results.json" 2>&1 | tee udp-runtime.log
      - name: Prepare verified legacy Reality client for compatibility acceptance
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/xray-legacy"
          mkdir -p "$fixture"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/XTLS/Xray-core/releases/download/v25.10.15/Xray-linux-64.zip \
            -o "$fixture/client.zip"
          (cd "$fixture" && echo 'df22ad60c1251c9fb63d7f85b3677872edf61c6715eba64b06adbfec658f4938  client.zip' | sha256sum --check)
          unzip -j "$fixture/client.zip" xray -d "$fixture"
          chmod 700 "$fixture/xray"
          "$fixture/xray" version
      - name: Build release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
          HL_PANEL_LICENSE_ISSUER_URL: ${{ vars.HL_PANEL_LICENSE_ISSUER_URL }}
          HL_PANEL_LICENSE_ISSUER_ID: ${{ vars.HL_PANEL_LICENSE_ISSUER_ID }}
          HL_PANEL_LICENSE_PUBLIC_KEYS_B64: ${{ vars.HL_PANEL_LICENSE_PUBLIC_KEYS_B64 }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/hl-panel-release"
          mkdir -p "$release/bin" "$release/web-admin" "$release/deploy"
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          license_flags=$(python3 deploy/build-license-trust.py)
          go build -trimpath -ldflags "-X main.platformVersion=$RELEASE_TAG -X main.platformBuildTime=$build_time $license_flags" -o "$release/bin/control-api" ./apps/control-api
          "$release/bin/control-api" license trust
          go build -trimpath -o "$release/bin/usage-migrate" ./apps/usage-migrate
          go build -trimpath -ldflags "-X github.com/hongle/hl-panel/internal/agent/config.DefaultAgentVersion=$RELEASE_TAG" -o "$release/bin/edge-agent" ./apps/edge-agent
          manifest_sha=$(sha256sum "$RUNNER_TEMP/udp-release/bundle/manifest.json" | cut -d' ' -f1)
          python3 deploy/fetch-node-engines.py "$release" --gost-bundle "$RUNNER_TEMP/udp-release/bundle" --gost-manifest-sha256 "$manifest_sha"
          cmp "$RUNNER_TEMP/udp-release/bundle/gost" "$release/bin/gost"
          "$release/bin/xray" version
          "$release/bin/gost" -V
          # Real engines and loopback clients, no production services.
          env -u GOOS -u GOARCH NYVP_XRAY_BINARY="$release/bin/xray" NYVP_GOST_BINARY="$release/bin/gost" HL_TEST_XRAY_LEGACY_BINARY="$RUNNER_TEMP/xray-legacy/xray" go test -p 1 -v ./internal/agent/runtime ./internal/agent/engine ./internal/control/httpapi ./tests/integration/xray ./tests/integration/gost
          cp -R apps/web-admin/dist/. "$release/web-admin/"
          deployment_files=(
            deploy/README.md
            deploy/panel-license.md
            deploy/backup-and-restore.md
            deploy/install.sh
            deploy/activate-panel-license.sh
            deploy/setup-panel-license.sh
            deploy/check-panel-license.py
            deploy/install-node.sh
            deploy/reinstall-node.py
            deploy/configure-node-bbr2.py
            deploy/configure-node-bbr.py
            deploy/fetch-node-engines.py
            deploy/update.sh
            deploy/update.py
            deploy/node-update-worker.py
            deploy/install-node-update.py
            deploy/panel-update-worker.py
            deploy/update-node.py
            deploy/configure-reality.sh
            deploy/configure-reality.py
            deploy/enable-domain-tls.sh
            deploy/edge-agent/enroll.sh
            deploy/edge-agent/install.sh
            deploy/env/control-api.env.example
            deploy/nginx/hl-panel.conf.template
            deploy/nginx/conf.d/hl-panel-rate-limit.conf
            deploy/nginx/snippets/hl-panel-api-proxy.conf
            deploy/nginx/snippets/hl-panel-migration-proxy.conf
            deploy/node-control-url.py
            deploy/nginx/snippets/hl-panel-app-locations.conf
            deploy/nginx/snippets/hl-panel-security-headers.conf
            deploy/systemd/hl-panel-control-api.service
            deploy/systemd/hl-panel-update.socket
            deploy/systemd/hl-panel-update.service
            deploy/systemd/hl-panel-node-update.socket
            deploy/systemd/hl-panel-node-update.service
            deploy/systemd/hl-panel-edge-agent.service
          )
          for source_file in "${deployment_files[@]}"; do
            mkdir -p "$release/$(dirname "$source_file")"
            cp "$source_file" "$release/$source_file"
          done
          (
            cd "$release"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar -C "$release" -czf "$RUNNER_TEMP/hl-panel-linux-amd64.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum hl-panel-linux-amd64.tar.gz > hl-panel-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hl-panel-candidate
          path: |
            ${{ runner.temp }}/hl-panel-linux-amd64.tar.gz
            ${{ runner.temp }}/hl-panel-linux-amd64.tar.gz.sha256
      - name: Build separate disposable signed installation candidate
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
          HL_PANEL_DISPOSABLE_INSTALL_TEST: 'true'
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/license-fixture"
          go build -trimpath -o "$RUNNER_TEMP/licensefixture" ./tests/install/licensefixture
          "$RUNNER_TEMP/licensefixture" --fixture "$fixture"
          mv "$RUNNER_TEMP/licensefixture" "$fixture/licensefixture"
          isolated="$RUNNER_TEMP/hl-panel-isolated"
          cp -R "$RUNNER_TEMP/hl-panel-release" "$isolated"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.platformVersion=$RELEASE_TAG $(cat "$fixture/ldflags")" -o "$isolated/bin/control-api" ./apps/control-api
          "$isolated/bin/control-api" license trust
          (cd "$isolated" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum --check SHA256SUMS)
          mkdir "$RUNNER_TEMP/isolated-candidate"
          tar -C "$isolated" -czf "$RUNNER_TEMP/isolated-candidate/hl-panel-linux-amd64.tar.gz" .
          (cd "$RUNNER_TEMP/isolated-candidate" && sha256sum hl-panel-linux-amd64.tar.gz > hl-panel-linux-amd64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/isolated-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-license-fixture
          retention-days: 1
          path: ${{ runner.temp }}/license-fixture/
  fresh-install:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        credentials: [default, custom]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Prepare bounded HTTPS package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Exercise existing nginx-light automatic adaptation
        if: matrix.os == 'ubuntu-22.04' && matrix.credentials == 'custom'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-light
      - name: Install and exercise a new isolated instance
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          CREDENTIALS: ${{ matrix.credentials }}
          EXPECT_NGINX_ADAPTATION: ${{ matrix.os == 'ubuntu-22.04' && matrix.credentials == 'custom' }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            HL_PANEL_EXPECT_NGINX_ADAPTATION="$EXPECT_NGINX_ADAPTATION" \
            python3 tests/install/fresh_install.py \
            --archive-directory "$RUNNER_TEMP/candidate" --version "$RELEASE_TAG" \
            --credentials "$CREDENTIALS" --automatic-free
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-install-${{ matrix.os }}-${{ matrix.credentials }}
          path: |
            fresh-install.log
            fresh-install-result.json
            fresh-install-issuer.log
            fresh-install-license-result.json
  nginx-compatibility:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - name: Prepare bounded HTTPS package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Verify nginx-light automatic adaptation and site preservation on a disposable VM
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 tests/install/nginx_compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nginx-compatibility-ubuntu-22.04
          path: |
            nginx-compatibility.log
            nginx-compatibility-result.json
  safe-update:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/checkout@v4
        with:
          ref: v0.1.5
          path: baseline-source
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Prepare bounded HTTPS package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Install the previous official version on a disposable VM
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          for file in hl-panel-linux-amd64.tar.gz hl-panel-linux-amd64.tar.gz.sha256; do
            curl -fsSL --retry 2 "https://github.com/Aurelian-HL/HL-Panel/releases/download/v0.1.5/$file" -o "$RUNNER_TEMP/baseline/$file"
          done
          (cd "$RUNNER_TEMP/baseline" && sha256sum --check hl-panel-linux-amd64.tar.gz.sha256)
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" python3 baseline-source/tests/install/fresh_install.py --archive-directory "$RUNNER_TEMP/baseline" --version v0.1.5 --credentials default
      - name: Verify data-preserving update and real database rollback
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" python3 tests/install/preserve_update.py --archive-directory "$RUNNER_TEMP/candidate" --previous-version v0.1.5 --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserve-update-${{ matrix.os }}
          path: |
            fresh-install.log
            preserve-update-result.json
  node-install:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Prepare bounded HTTPS package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Verify complete node installation and real forwarding on a disposable VM
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" python3 tests/install/node_install.py --archive-directory "$RUNNER_TEMP/candidate" --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-install
          path: |
            node-install.log
            node-install-result.json
  panel-migration:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Prepare bounded HTTPS package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Prepare isolated PostgreSQL and candidate binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql openssl
          sudo systemctl start postgresql
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check hl-panel-linux-amd64.tar.gz.sha256)
          mkdir -p "$RUNNER_TEMP/migration-candidate"
          tar -xzf "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz" -C "$RUNNER_TEMP/migration-candidate"
          # The postgres service user needs read/traverse access to candidate binaries.
          sudo install -d -m 755 /var/tmp/hl-panel-migration-ci
          sudo cp -R "$RUNNER_TEMP/migration-candidate/bin" /var/tmp/hl-panel-migration-ci/
      - name: Restore real panels, switch the real agent and verify loopback forwarding
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          sudo env HL_PANEL_DISPOSABLE_MIGRATION_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" python3 tests/install/panel_migration.py \
            --binaries /var/tmp/hl-panel-migration-ci/bin --version "$RELEASE_TAG" | tee panel-migration-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-migration
          path: panel-migration-result.log
  automatic-migration:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Prepare package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Verify receiver installation, encrypted restore and restart isolation
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" python3 tests/install/automatic_migration.py \
            --archive-directory "$RUNNER_TEMP/candidate" --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-migration
          path: automatic-migration-result.json
  publish:
    needs: [release, fresh-install, nginx-compatibility, safe-update, node-install, panel-migration, automatic-migration, web-update]
    if: ${{ inputs.verification_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-candidate
          path: ${{ runner.temp }}/candidate
      - name: Publish GitHub release only after fresh installation passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz.sha256" \
            --title "HL-panel $tag" \
            --verify-tag \
            --generate-notes
  web-update:
    # Fixed GitHub URLs map to the disposable signed candidate; run before publish.
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-isolated-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: disposable-license-fixture
          path: ${{ runner.temp }}/license-fixture
      - name: Protect disposable test-only issuer key
        run: |
          chmod 700 "$RUNNER_TEMP/license-fixture" "$RUNNER_TEMP/license-fixture/licensefixture"
          chmod 600 "$RUNNER_TEMP/license-fixture/issuer-key" "$RUNNER_TEMP/license-fixture/ldflags"
      - name: Build isolated older baseline with the update channel
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          python3 tests/install/web_release_fixture.py --output-directory "$RUNNER_TEMP/web-release-overlay"
          CGO_ENABLED=0 go build -overlay "$RUNNER_TEMP/web-release-overlay/overlay.json" -trimpath -ldflags "-X main.platformVersion=v0.1.0 $(cat "$RUNNER_TEMP/license-fixture/ldflags")" -o "$RUNNER_TEMP/baseline-control-api" ./apps/control-api
          python3 tests/install/web_update.py --prepare --version "$RELEASE_TAG" \
            --archive-directory "$RUNNER_TEMP/candidate" --baseline-binary "$RUNNER_TEMP/baseline-control-api" \
            --output-directory "$RUNNER_TEMP/web-baseline"
      - name: Prepare package downloads on the disposable VM
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/prepare_ci_apt.py
      - name: Install the isolated baseline
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/fresh_install.py --archive-directory "$RUNNER_TEMP/web-baseline" --version v0.1.0 --credentials default
      - name: Verify two real HTTP upgrades and a real rollback
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true HL_PANEL_LICENSE_FIXTURE_DIR="$RUNNER_TEMP/license-fixture" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 tests/install/web_update.py --version "$RELEASE_TAG" --archive-directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-update
          path: |
            fresh-install.log
            web-update-result.json
