name: HL-panel release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build
        required: true
        default: v0.1.1
        type: string
      verification_only:
        description: Repeat all installation and forwarding checks without publishing again
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nyvp_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nyvp_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      commit: ${{ steps.release_ref.outputs.commit }}
    steps:
      - name: Resolve existing release tag
        id: release_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'Release tag must start with v and a digit and contain only letters, digits, dots, underscores, or hyphens.' >&2
            exit 1
          fi
          remote_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.ref')
          if [[ "$remote_ref" != "refs/tags/$tag" ]]; then
            echo 'The requested release tag does not exist in this repository.' >&2
            exit 1
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The release tag did not resolve to a commit.' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - name: Verify Go
        env:
          NYVP_TEST_POSTGRES_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/nyvp_release_test?sslmode=disable
          NYVP_TEST_POSTGRES_ALLOW_MUTATION: 'true'
        run: |
          go test ./...
          go vet ./...
          bash -n install.sh install-node.sh update.sh update-node.sh deploy/install.sh deploy/install-node.sh deploy/update.sh deploy/enable-domain-tls.sh deploy/configure-reality.sh
          sh -n deploy/edge-agent/install.sh deploy/edge-agent/enroll.sh
          python3 -m py_compile deploy/update.py deploy/update-node.py deploy/configure-reality.py tests/install/preserve_update.py
          python3 -m py_compile tests/install/fresh_install.py
          python3 -m py_compile tests/install/node_install.py deploy/fetch-node-engines.py
          python3 tests/install/test_node_update.py
      - name: Build web admin
        working-directory: apps/web-admin
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/hl-panel-release"
          mkdir -p "$release/bin" "$release/web-admin" "$release/deploy"
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags "-X main.platformVersion=$RELEASE_TAG -X main.platformBuildTime=$build_time" -o "$release/bin/control-api" ./apps/control-api
          go build -trimpath -o "$release/bin/usage-migrate" ./apps/usage-migrate
          go build -trimpath -ldflags "-X github.com/hongle/hl-panel/internal/agent/config.DefaultAgentVersion=$RELEASE_TAG" -o "$release/bin/edge-agent" ./apps/edge-agent
          python3 deploy/fetch-node-engines.py "$release"
          "$release/bin/xray" version
          "$release/bin/gost" -V
          # Real engines and loopback clients, no production services.
          env -u GOOS -u GOARCH NYVP_XRAY_BINARY="$release/bin/xray" NYVP_GOST_BINARY="$release/bin/gost" go test -v ./tests/integration/xray ./tests/integration/gost
          cp -R apps/web-admin/dist/. "$release/web-admin/"
          deployment_files=(
            deploy/README.md
            deploy/install.sh
            deploy/install-node.sh
            deploy/fetch-node-engines.py
            deploy/update.sh
            deploy/update.py
            deploy/update-node.py
            deploy/configure-reality.sh
            deploy/configure-reality.py
            deploy/enable-domain-tls.sh
            deploy/edge-agent/enroll.sh
            deploy/edge-agent/install.sh
            deploy/env/control-api.env.example
            deploy/nginx/hl-panel.conf.template
            deploy/nginx/conf.d/hl-panel-rate-limit.conf
            deploy/nginx/snippets/hl-panel-api-proxy.conf
            deploy/nginx/snippets/hl-panel-app-locations.conf
            deploy/nginx/snippets/hl-panel-security-headers.conf
            deploy/systemd/hl-panel-control-api.service
            deploy/systemd/hl-panel-edge-agent.service
          )
          for source_file in "${deployment_files[@]}"; do
            mkdir -p "$release/$(dirname "$source_file")"
            cp "$source_file" "$release/$source_file"
          done
          (
            cd "$release"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar -C "$release" -czf "$RUNNER_TEMP/hl-panel-linux-amd64.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum hl-panel-linux-amd64.tar.gz > hl-panel-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hl-panel-candidate
          path: |
            ${{ runner.temp }}/hl-panel-linux-amd64.tar.gz
            ${{ runner.temp }}/hl-panel-linux-amd64.tar.gz.sha256
  fresh-install:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        credentials: [default, custom]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-candidate
          path: ${{ runner.temp }}/candidate
      - name: Exercise existing nginx-light automatic adaptation
        if: matrix.os == 'ubuntu-22.04' && matrix.credentials == 'custom'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-light
      - name: Install and exercise a new isolated instance
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          CREDENTIALS: ${{ matrix.credentials }}
          EXPECT_NGINX_ADAPTATION: ${{ matrix.os == 'ubuntu-22.04' && matrix.credentials == 'custom' }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true \
            HL_PANEL_EXPECT_NGINX_ADAPTATION="$EXPECT_NGINX_ADAPTATION" \
            python3 tests/install/fresh_install.py \
            --archive-directory "$RUNNER_TEMP/candidate" --version "$RELEASE_TAG" \
            --credentials "$CREDENTIALS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-install-${{ matrix.os }}-${{ matrix.credentials }}
          path: |
            fresh-install.log
            fresh-install-result.json
  nginx-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - name: Verify nginx-light automatic adaptation and site preservation on a disposable VM
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 tests/install/nginx_compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nginx-compatibility-ubuntu-22.04
          path: |
            nginx-compatibility.log
            nginx-compatibility-result.json
  safe-update:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/checkout@v4
        with:
          ref: v0.1.5
          path: baseline-source
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install the previous official version on a disposable VM
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          for file in hl-panel-linux-amd64.tar.gz hl-panel-linux-amd64.tar.gz.sha256; do
            curl -fsSL --retry 2 "https://github.com/Aurelian-HL/HL-Panel/releases/download/v0.1.5/$file" -o "$RUNNER_TEMP/baseline/$file"
          done
          (cd "$RUNNER_TEMP/baseline" && sha256sum --check hl-panel-linux-amd64.tar.gz.sha256)
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 baseline-source/tests/install/fresh_install.py --archive-directory "$RUNNER_TEMP/baseline" --version v0.1.5 --credentials default
      - name: Verify data-preserving update and real database rollback
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 tests/install/preserve_update.py --archive-directory "$RUNNER_TEMP/candidate" --previous-version v0.1.5 --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserve-update
          path: |
            fresh-install.log
            preserve-update-result.json
  node-install:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-candidate
          path: ${{ runner.temp }}/candidate
      - name: Verify complete node installation and real forwarding on a disposable VM
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo env HL_PANEL_DISPOSABLE_INSTALL_TEST=true python3 tests/install/node_install.py --archive-directory "$RUNNER_TEMP/candidate" --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-install
          path: |
            node-install.log
            node-install-result.json
  publish:
    needs: [release, fresh-install, nginx-compatibility, safe-update, node-install]
    if: ${{ inputs.verification_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hl-panel-candidate
          path: ${{ runner.temp }}/candidate
      - name: Publish GitHub release only after fresh installation passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/candidate/hl-panel-linux-amd64.tar.gz.sha256" \
            --title "HL-panel $tag" \
            --verify-tag \
            --generate-notes
